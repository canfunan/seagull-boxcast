name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release 建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub ubuntu runner 预装 Android SDK；显式装 compileSdk 对应 platform（防缺失）
      - name: Ensure SDK platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK to Release
        # Actions artifact 配额 500MB 且计量 6-12h 才刷新，曾连爆两次 → 改传 Release：
        # Release 资产不计入 Actions 存储配额，tag 前缀 = commit sha 可追溯
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: CI build ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
